# ==========================
# CONFIGURAÇÕES GERAIS
# ==========================


# Tipo de banco
quarkus.datasource.db-kind=postgresql

# Configuração padrão (usada em todos os ambientes, exceto se sobrescrita)
# Mude o usuário para postgres (o dono que aparece na sua imagem)
quarkus.datasource.username=postgres

# Mude a senha para a senha que você definiu na instalação do Postgres
quarkus.datasource.password=123456

# Mude o final da URL para topicos1 (removendo o "db" do final, conforme a imagem)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos1
# Log do Hibernate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=*

#configuracao jwt
mp.jwt.verify.publickey.location=token/publicKey.pem
mp.jwt.verify.issuer=ewine-jwt
smallrye.jwt.sign.key.location=token/privateKey.pem

# ==========================
# AMBIENTE DE DESENVOLVIMENTO (DEV)
# ==========================

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.datasource.dev-ui.allow-sql=true
# No dev, não precisa carregar o import.sql (opcional)


# ==========================
# AMBIENTE DE TESTES (TEST)
# ==========================

%test.quarkus.hibernate-orm.database.generation=drop-and-create
# Aqui garantimos que os dados do import.sql serão carregados
%test.quarkus.hibernate-orm.sql-load-script=import.sql



# ========================================
# LOGS
# ========================================
quarkus.log.level=INFO
quarkus.log.category."br.unitins.topicos1.ewine.service".level=DEBUG
quarkus.log.file.enable=true
quarkus.log.file.path=logs/ewine.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %s%e%n                 
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=7
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.console.color=true

# SeaweedFS (upload de imagens)
ewine.storage.seaweed.filer-url=http://localhost:8888
ewine.storage.seaweed.bucket=ewine-produtos
ewine.storage.local-dir=uploads/produtos
ewine.storage.local-base-url=http://localhost:8080/uploads/produtos
